<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SidelineReel | Roster review</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172b36;font:16px system-ui}header{background:#12372f;color:white;padding:24px}main{max-width:920px;margin:30px auto;padding:0 18px}section{background:white;border:1px solid #dce4e2;border-radius:14px;padding:24px;margin:16px 0}button,select{font:inherit;padding:10px 14px;border:1px solid #a9bcb5;border-radius:8px;background:white}button{cursor:pointer}button.primary{background:#146a50;color:white;border:0}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,select:focus-visible{outline:3px solid #de981e}.muted{color:#53666a}.pill{display:inline-block;background:#fff0d0;color:#744600;padding:6px 10px;border-radius:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.clip{background:#dcebdc;border-radius:10px;min-height:180px;display:grid;place-items:center;text-align:center}svg{max-width:100%}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}h1,h2{margin-top:0}label{display:block;margin:12px 0 5px}li{margin:8px 0}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><header><strong>SIDELINE / REEL</strong> &nbsp; · &nbsp; Coach workspace</header><main><p class="muted">Demo · Fictional roster and simulated AI detections · No real footage or messages</p><h1>Review player matches</h1><p>Ridgeline U12 · Weekly recap · 4 candidate highlights</p><div id="app"></div></main><script>
const roster=[{id:'p4',name:'Player A',num:'4'},{id:'p14',name:'Player B',num:'14'},{id:'p1',name:'Player C',num:'1'},{id:'p11',name:'Player D',num:'11'}];const initial=[{id:'H01',time:'02:14',det:'4 / 14',candidate:'p4',state:'pending',reason:'Similar jersey numbers',score:'0.61'},{id:'H02',time:'08:42',det:'1 / 11',candidate:'p1',state:'pending',reason:'Partial jersey visibility',score:'0.58'},{id:'H03',time:'14:10',det:'14',candidate:'p14',state:'auto',reason:'Simulated clear match',score:'0.98'},{id:'H04',time:'21:08',det:'4',candidate:'p4',state:'auto',reason:'Simulated clear match',score:'0.97'}];let clips,log,stage,active,published;function reset(){clips=initial.map(x=>({...x}));log=[];stage='queue';active=null;published=false;render()}const person=id=>roster.find(p=>p.id===id);const pending=()=>clips.filter(c=>c.state==='pending').length;function review(id){active=id;stage='review';render()}function decide(action){if(published)return;let c=clips.find(x=>x.id===active);if(!c||c.state!=='pending')return;let sel=document.getElementById('player').value;if(action==='confirm'&&!person(sel))return;let before=c.candidate;c.state=action==='exclude'?'excluded':'reviewed';c.candidate=action==='exclude'?null:sel;log.push(`${c.id}: ${action==='exclude'?'Excluded':person(before).name+' → '+person(sel).name} · Coach review`);stage='queue';render()}function release(){if(pending()||published)return;published=true;stage='done';log.push('Weekly recap released (simulation)');render()}function render(){let a=document.getElementById('app');let counts=`<span class="pill">${pending()} need review</span> <span class="muted">${clips.filter(c=>['auto','reviewed'].includes(c.state)).length} ready · ${clips.filter(c=>c.state==='excluded').length} excluded</span>`;if(stage==='queue'){a.innerHTML=`<section><h2>1. Review queue</h2><div class="bar">${counts}</div><p>Only uncertain matches require coach review. Unresolved highlights cannot be released.</p>${clips.map(c=>`<section><div class="bar"><strong>${c.id} · ${c.time}</strong><span class="muted">${c.reason} · confidence ${c.score}</span></div><p>${c.state==='excluded'?'Excluded':person(c.candidate).name+' · #'+person(c.candidate).num} — ${c.state}</p>${c.state==='pending'?`<button onclick="review('${c.id}')">Review match</button>`:''}</section>`).join('')}<button class="primary" ${pending()?'disabled':''} onclick="stage='preview';render()">Preview release</button> <button onclick="reset()">Reset demo</button><p class="muted">${pending()?'Resolve or exclude every flagged clip to continue.':'All flagged clips resolved.'}</p></section>`}else if(stage==='review'){let c=clips.find(x=>x.id===active);a.innerHTML=`<section><h2>2. Verify highlight ${c.id}</h2><div class="grid"><div class="clip"><div><svg width="180" height="120" viewBox="0 0 180 120" aria-label="Illustrative jersey number ambiguity"><path d="M55 12 L20 30 L35 60 L50 52 L50 110 L130 110 L130 52 L145 60 L160 30 L125 12 L110 22 L70 22 Z" fill="#146a50"/><text x="90" y="77" text-anchor="middle" fill="white" font-size="25">${c.det}</text></svg><div>Illustrative jersey cue · ${c.time}</div></div></div><div><p><strong>AI suggestion:</strong> ${person(c.candidate).name} (#${person(c.candidate).num})</p><p>${c.reason}. Confidence ${c.score} (simulated).</p><label for="player">Verified player</label><select id="player"><option value="">Choose only if verified</option>${roster.map(p=>`<option value="${p.id}">#${p.num} — ${p.name}</option>`).join('')}</select><p class="muted">If identity cannot be verified, exclude the clip rather than guess.</p></div></div><div class="bar"><button class="primary" onclick="decide('confirm')">Confirm selected player</button><button onclick="decide('exclude')">Exclude highlight</button><button onclick="stage='queue';render()">Back / leave pending</button></div></section>`;let s=document.getElementById('player'),b=a.querySelector('button.primary');b.disabled=true;s.onchange=()=>b.disabled=!s.value}else{a.innerHTML=`<section><h2>${published?'Released (simulation)':'3. Preview and release'}</h2><div class="bar">${counts}</div><h3>Personal reels and team recap</h3><ul>${roster.map(p=>`<li>${p.name} (#${p.num}): ${clips.filter(c=>c.candidate===p.id&&['auto','reviewed'].includes(c.state)).map(c=>c.id).join(', ')||'No approved highlights'}</li>`).join('')}</ul><p>Team recap includes only ready highlights. Excluded clips are omitted from both outputs.</p><h3>Review history</h3><ul>${log.map(l=>`<li>${l}</li>`).join('')}</ul>${published?'<p role="status">Release recorded once. No real notifications were sent.</p><button onclick="reset()">Reset demo</button>':'<button class="primary" onclick="release()">Release weekly recap</button> <button onclick="stage=\'queue\';render()">Back</button>'}</section>`}}reset();</script></html>
